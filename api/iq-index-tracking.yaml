openapi: 3.0.3
info:
  title: Inspiration-Q Index Tracking API
  description: |-
    This is the Index Tracking API definition, developed by Inspiration-Q.
    
    More information at [https://www.inspiration-q.com](https://www.inspiration-q.com/).
    
  contact:
    email: support@inspiration-q.com
  version: 1.0.0

externalDocs:
  description: Inspiration-Q website
  url: https://www.inspiration-q.com/

servers:
  - url: https://www.inspiration-q.com/api/v1
    description: Production server

tags:
  - name: iQ-Finance
    description: Financial solutions

paths:
  /iq-finance/index-tracking:
    post:
      security:
          - ApiKeyAuth: []
      tags:
        - iQ-Finance
      summary: Create a new Index Tracking computation.
      description: Create a new Index Tracking computation.
      operationId: addIndexTrackingOperation
      requestBody:
        description: Create a IndexTracking computation.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndexTracking'
        required: true
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputationResult'
        '400':
          description: Invalid input, including a top-level field the request does not have ("Unknown fields"; hyperparameters go inside `options`), an option the algorithm does not have, or a value it cannot take. The problem names the fields or options in `keys`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/OptionsProblem'
        '422':
          description: Validation exception
        '503':
          description: The service cannot read its configuration right now; the computation was not started. Try again later.

  /iq-finance/index-tracking/{indexTrackingComputationId}:
    get:
      security:
        - ApiKeyAuth: []
      tags:
        - iQ-Finance
      summary: Find Index Tracking computation by ID
      description: Returns a single Index Tracking computation.
      operationId: getIndexTrackingComputationById
      parameters:
        - name: indexTrackingComputationId
          in: path
          description: ID of the Index Tracking computation to return
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputationResult'
        '400':
          description: Invalid computation ID supplied
        '404':
          description: Computation not found


components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Ocp-Apim-Subscription-Key
  schemas:
    ComputationResult:
      type: object
      properties:
        computationId:
          type: string
          description: Identifier of the computation. This ID is generated by the Inspiration-Q server.
          example: 28476298467297626
        type:
          type: string
          description: Type of computation launched.
        description:
          type: string
          description: Description of the computation launched, to help the user to identify the use case.
          example: QUBO computation for the use case 001. 
        status:
          type: string
          enum: [Pending, Computing, Failed, Ok]
          description: "Pending: the computation is waiting to start. Computing: the computation is running. Failed: the computation has failed. Ok: the computation has finished properly and the solution is ready."
          example: Ok
        error_description:
          type: string
          example: "Validation: The input utility matrix is not a square matrix."
          description: String with the description of any error that resulted in the computation. 
        progress:
          type: integer
          format: Int32
          description: Progress percentage of the computation.
          example: 76
        computationTime:
          type: number
          description: Time spent on computing the result in seconds.
          example: 647
        computationStartTime:
          type: string
          format: date-time
          description: Datetime when computation begins.
          example: "2017-07-21T17:32:28Z"
        computationStoreTime:
          type: string
          format: date-time
          description: Datetime when computation is stored in the server.
          example: "2017-07-21T17:32:28Z"
        solution:
          type: array
          items:
            type: number
          example: [0, 1]
          description: Optimal solution found for the problem.
        named_solution:
          type: object
          additionalProperties:
            type: number
          example: {"alpha": 0.2, "beta": 0.8}
          description: Optimal solution found for the problem with an identifier for each of the members of the solution.
        cost:
          type: number
          description: Optional. Minimum value found for the cost function.
        weights:
          type: array
          items:
            type: number
          description: Optional. Weights that corresponds to the solution.
        warnings:
          type: array
          items:
            type: string
          description: Only in the answer to a new computation. One entry per option sent that the implementation running the computation does not use, and therefore ignored.
          example: ["Option 'num_threads' is ignored: the C++ implementation of /qubo_pa does not use it."]

    OptionsProblem:
      type: object
      description: Problem answered when the fields or options of a new computation are rejected.
      properties:
        title:
          type: string
          example: Unknown options
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: "/qubo_pa has no options 'shots', 'betaSteps'."
        keys:
          type: array
          items:
            type: string
          description: The fields or options at fault.
          example: ["shots", "betaSteps"]

    Seed:
      type: integer
      format: int64
      minimum: 0
      maximum: 4294967295
      default: 0
      description: "Seed of the random number generator, an unsigned 32-bit integer. It is a field of the request, not an option: a `seed` inside `options` is answered 400. Two runs with the same seed, problem and options give the same result. If omitted, 0 is used. The brute-force algorithms (`bf`) do not use a seed: one sent to them is ignored and reported in `warnings`."
      example: 12345

    Options:
      type: object
      additionalProperties: false
      description: |
        Hyperparameters of the algorithms, sent flat in the `options` object of a request. There is
        one set of names for every algorithm; the `options` description of each request says which
        ones its algorithms accept and their defaults. An option the algorithm does not accept, or a
        value it cannot take, is answered 400. An option that the implementation running the
        computation does not read (C++ or Python, set per organization) is accepted, ignored and
        reported in the `warnings` of the response. Options left out take the defaults.

        The seed of the random number generator is not an option: it is the `seed` field of the
        request.
      properties:
        num_threads:
          type: integer
          format: int32
          minimum: 0
          description: "Number of threads. 0 lets the solver use every core."
        max_duration_seconds:
          type: number
          minimum: 0
          description: "Time limit in seconds. 0 means no limit."
        num_states:
          type: integer
          format: int32
          minimum: 0
          description: "Number of states: the configurations of the population in population annealing, the independent chains in simulated annealing, or the bit strings sampled in QUBO `cont`. At least 1, except in QUBO `cont`, where 0 returns the rounded relaxed solution instead of sampling."
        num_temperature_steps:
          type: integer
          format: int32
          minimum: 1
          nullable: true
          description: "Number of temperature steps. In QUBO and QBO `sa` and `ca`, each one is a sweep, and null calibrates it from the size of the problem."
        epsilon:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: "Controls how much the inverse temperature changes at each step."
        num_mcmc_sweeps:
          type: integer
          format: int32
          minimum: 1
          description: "Number of Monte Carlo sweeps at each temperature."
        initial_uphill_acceptance_rate:
          type: number
          minimum: 0
          maximum: 1
          exclusiveMaximum: true
          description: "Fraction of uphill moves accepted at the first temperature. 0 derives the first temperature from the spread of the initial costs."
        loss_std_tolerance:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: "Stops early once the standard deviation of the costs in the population falls below this value."
        num_best_states:
          type: integer
          format: int32
          minimum: 1
          description: "Number of best states kept."
        admm_rho:
          type: number
          minimum: 0
          exclusiveMinimum: true
          nullable: true
          description: "ADMM penalty parameter. Leave it out (or null) to search the best one over a grid."
        admm_max_steps:
          type: integer
          format: int32
          minimum: 1
          description: "Maximum number of ADMM iterations."
        admm_eps:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: "Primal and dual residual convergence tolerance."
        admm_eps_pinf:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: "Primal infeasibility detection tolerance."
        admm_eps_bad_solution:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: "Tolerance above which a solution is rejected (Python implementation)."
        admm_alpha:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: "ADMM relaxation parameter (Python implementation)."
        admm_sigma:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: "ADMM regularization of the linear system (Python implementation)."
        admm_scaling:
          type: string
          enum: [none, ruiz]
          description: "Scaling of the problem before ADMM: none, or Ruiz equilibration (C++ implementation)."
        admm_rho_grid_min_exp:
          type: number
          description: "Smallest rho of the grid search, as a power of 10 (C++ implementation)."
        admm_rho_grid_max_exp:
          type: number
          description: "Largest rho of the grid search, as a power of 10 (C++ implementation)."
        admm_rho_grid_num:
          type: integer
          format: int32
          minimum: 1
          description: "Number of rho values of the grid search (C++ implementation)."
        admm_convergence_check_interval:
          type: integer
          format: int32
          minimum: 1
          description: "ADMM iterations between convergence checks (C++ implementation)."

    IndexTracking:
      required:
        - assets_utility_matrix
        - assets_to_benchmark_utility_vector
        - portfolio_size
      type: object
      properties:
        description:
          type: string
          description: A brief description of the portfolio that will be obtained.
          example: SP500 tracker, size=60
        comment:
          type: string
          description: A free comment stored with the computation.
        assets_utility_matrix:
          type: array
          description: The quadratic utility matrix of the assets in the look back window.
          items:
            type: array
            items:
              type: number
          example: [ [1.23, 2.13], [3.13, 4.09] ]
        assets_to_benchmark_utility_vector:
          type: array
          description: The quadratic utility vector between the assets and the benchmark in the look back window.
          items:
            type: number
          example: [1.31, 33.541]
        asset_names:
          type: array
          description: List with names or identifiers of the assets used in the input covariances.
          items:
            type: string
          example: [ticker_a, ticker_b]
        portfolio_size:
          type: integer
          description: The number of assets inside the portfolio.
          format: int32
          minimum: 1
          maximum: 2047
        minimum_weight:
          type: number
          description: The minimum allowed weight for each asset included in the portfolio, from 0 to 1. If not provided defaults to 0.
          example: 0.25
        maximum_weight:
          type: number
          description: The maximum allowed weight for each asset included in the portfolio, from 0 to 1. If not provided defaults to 1.
          example: 7.25
        linear_constraints_matrix:
          type: array
          description: Matrix of linear constraints. Each row corresponds to one constraint. Constraints can be both equalities and inequalities. 
          items:
            type: array
            items:
              type: number
          example: [ [1.23, 2.13], [3.13, 4.09] ]
        lower_bounds_vector:
          type: array
          description: Vector of lower bounds for each linear constraint.
          items:
            type: number
          example: [-1232, -23415]
        upper_bounds_vector:
          type: array
          description: Vector of upper bounds for each linear constraint.
          items:
            type: number
          example: [2345, 1233]
        previous_portfolio:
          description: If given, a map or dictionary with the name or identifier of the asset and the weights in the previous portfolio. The weights of the previous portfolio whose sum is equal to 1.
          type: object
          additionalProperties:
            type: number
          example: {"ticker_a": 0.2, "ticker_b": 0.8}
        max_companies_rotation:
          type: integer
          description: If given a previous portfolio, the maximum number of assets that can change from the previous portfolio to the newly computed one.
          example: 2
        max_sales_rotation:
          type: number
          description: If given a previous portfolio, the maximum percentage (from 0 to 1) that can be sold from the previous portfolio to the newly computed one.
          example: 0.8
        sectorial_weights:
          description: If given, a map or dictionary with the name of the sector and the weight that is should have in the requested portfolio. The sum of weights must be 1.
          type: object
          additionalProperties:
            type: number
          example: {"technology": 0.6, "energy": 0.4}
        sectorial_distribution:
          description: A map or dictionary with the name or identifier of the asset and the sector to which it belongs.
          type: object
          additionalProperties:
            type: string
          example: {"ticker_a": "technology", "ticker_b": "energy"}
        sectorial_weight_tolerance:
          description: The maximum allowed absolute deviation from the sectorial weights in the solution.
          type: number
          example: 0.05
        sum_of_portfolio_weights:
          description: The expected sum of the output weights. Example, if the portfolio weights should sum up to 85%, then this parameter should be 0.85.
          type: number
          example: 1.0
        seed:
          $ref: '#/components/schemas/Seed'
        options:
          description: |
            Hyperparameters. Which options each algorithm accepts, with their defaults:
            - index tracking: `num_threads` (1), `max_duration_seconds` (0; C++ only), `num_states` (30), `num_temperature_steps` (100), `epsilon` (0.1), `num_mcmc_sweeps` (5), `initial_uphill_acceptance_rate` (0; C++ only), `loss_std_tolerance` (1e-4; C++ only), `num_best_states` (1; C++ only), `admm_rho` (solver's own), `admm_max_steps` (1000), `admm_eps` (1e-5), `admm_eps_pinf` (1e-7), `admm_eps_bad_solution` (1e-5; Python only), `admm_alpha` (1.6; Python only), `admm_sigma` (1e-7; Python only), `admm_scaling` ("none"; C++ only), `admm_rho_grid_min_exp` (-3; C++ only), `admm_rho_grid_max_exp` (3; C++ only), `admm_rho_grid_num` (31; C++ only), `admm_convergence_check_interval` (10; C++ only).
          allOf:
            - $ref: '#/components/schemas/Options'